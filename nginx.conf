# Cache policy by content type (html stays fresh; hashed assets cache forever).
map $sent_http_content_type $nh_cache {
    default              "public, max-age=31536000, immutable";
    "~*text/html"        "no-cache";
    "~*application/xml"  "public, max-age=3600";
    "~*text/plain"       "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm application/xml application/manifest+json;

    # ---- security headers (inherited by every location that doesn't set its own) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $nh_cache always;
    # 'wasm-unsafe-eval' is required to compile the image-codec WebAssembly.
    # No 'unsafe-eval', no inline scripts. Everything is same-origin & self-hosted.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    # ---- container healthcheck ----
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- ensure correct WASM MIME type ----
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # ---- clean URLs: /heic-to-jpg -> /heic-to-jpg.html ----
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Don't serve dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
